<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta Guiada — Nutrologia</title>
<style>
  :root {
    --bg:        #FAF9F6;
    --surface:   #FFFFFF;
    --border:    #E7E4DD;
    --border-soft: #F0EEE8;
    --ink:       #24231F;
    --ink-soft:  #6E6B62;
    --ink-faint: #A9A69C;
    --accent:      #B3654A;
    --accent-soft: #F3E4DA;
    --accent-dark: #8F4E38;
    --good:      #3F7A5C;
    --good-soft: #E4EEE7;
    --warn:      #B3843A;
    --warn-soft: #F5ECDD;
    --bad:       #B34A3F;
    --bad-soft:  #F6E4E1;
    --radius: 10px;
    --radius-sm: 7px;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.55;
  }
  .app { display:flex; min-height:100vh; }

  /* Sidebar */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 22px 18px;
    display:flex; flex-direction:column;
  }
  .sidebar .brand { font-size: 15px; font-weight: 700; letter-spacing:.2px; margin-bottom:2px; }
  .sidebar .brand-sub { font-size: 11px; color: var(--ink-faint); text-transform:uppercase; letter-spacing:.6px; margin-bottom:20px; }
  .search-input {
    width:100%; padding:9px 11px; border:1px solid var(--border); border-radius: var(--radius-sm);
    font-size:13px; background: var(--bg); color: var(--ink); margin-bottom:16px;
  }
  .search-input:focus { outline:none; border-color: var(--accent); }
  .section-label { font-size:10.5px; color: var(--ink-faint); text-transform:uppercase; letter-spacing:.6px; margin: 4px 0 8px; }
  .patient-list { list-style:none; margin:0; padding:0; flex:1; overflow-y:auto; }
  .patient-row {
    padding:10px 11px; border-radius: var(--radius-sm); cursor:pointer; margin-bottom:4px;
    border:1px solid transparent;
  }
  .patient-row:hover { background: var(--bg); }
  .patient-row.active { background: var(--accent-soft); border-color: var(--accent); }
  .patient-row .pname { font-weight:600; font-size:13px; }
  .patient-row .pmeta { font-size:11.5px; color: var(--ink-faint); margin-top:1px; }
  .sidebar-actions { display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  .btn {
    font-family:inherit; font-size:12.5px; font-weight:600; padding:9px 14px; border-radius: var(--radius-sm);
    border:1px solid var(--border); background: var(--surface); color: var(--ink); cursor:pointer;
    transition: background .12s;
  }
  .btn:hover { background: var(--bg); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color:#fff; }
  .btn.primary:hover { background: var(--accent-dark); }
  .btn.ghost { background:transparent; border-color: var(--border); }
  .btn.danger { color: var(--bad); border-color:#e6cbc6; }
  .btn.small { padding:6px 10px; font-size:11.5px; }
  .file-btn { position:relative; overflow:hidden; display:inline-block; }
  .file-btn input[type=file] { position:absolute; inset:0; opacity:0; cursor:pointer; }
  .footnote { font-size:11px; color: var(--ink-faint); margin-top:14px; line-height:1.5; }

  /* Main */
  .main { flex:1; min-width:0; display:flex; flex-direction:column; }
  .patient-header {
    padding: 22px 32px 14px; display:flex; justify-content:space-between; align-items:flex-start;
    border-bottom: 1px solid var(--border-soft);
  }
  .patient-header h1 { font-size:19px; margin:0 0 3px; font-weight:700; }
  .patient-header .meta { font-size:12px; color: var(--ink-faint); }
  .header-actions { display:flex; gap:8px; }

  .step-nav { display:flex; gap:2px; padding: 14px 32px 0; border-bottom:1px solid var(--border-soft); overflow-x:auto; }
  .step-pill {
    display:flex; align-items:center; gap:7px; padding:9px 14px; font-size:12.5px; font-weight:600;
    color: var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;
  }
  .step-pill .n {
    width:19px; height:19px; border-radius:50%; background: var(--border-soft); color: var(--ink-faint);
    display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; flex-shrink:0;
  }
  .step-pill.active { color: var(--accent-dark); border-bottom-color: var(--accent); }
  .step-pill.active .n { background: var(--accent); color:#fff; }
  .step-pill.done .n { background: var(--good-soft); color: var(--good); }

  .step-panel { flex:1; padding: 26px 32px 60px; max-width: 880px; }
  .step-title { font-size:17px; font-weight:700; margin:0 0 4px; }
  .step-sub { font-size:12.5px; color: var(--ink-soft); margin: 0 0 20px; max-width:640px; }

  .field-grid { display:grid; grid-template-columns: 1fr 1fr; gap:14px 18px; }
  .field { display:flex; flex-direction:column; gap:5px; }
  .field label { font-size:12px; font-weight:600; color: var(--ink-soft); }
  .field label.checkbox-label { display:flex; align-items:flex-start; gap:8px; font-weight:600; color:var(--ink); cursor:pointer; }
  .field input[type=text], .field input[type=number], .field select, .field textarea {
    font-family:inherit; font-size:13px; padding:9px 11px; border:1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--ink); width:100%;
  }
  .field textarea { min-height:70px; resize:vertical; }
  .field input:focus, .field select:focus, .field textarea:focus { outline:none; border-color: var(--accent); }

  .card { background: var(--surface); border:1px solid var(--border); border-radius: var(--radius); padding:18px 20px; margin-bottom:16px; }
  .card-head { font-size:12.5px; font-weight:700; color: var(--ink); margin-bottom:10px; text-transform:uppercase; letter-spacing:.4px; }

  .diag-box { border-radius: var(--radius); padding:16px 18px; margin: 14px 0; border:1px solid var(--border); background: var(--surface); }
  .diag-headline { font-size:14px; font-weight:700; margin-bottom:6px; display:flex; align-items:center; gap:8px; }
  .diag-badge { display:inline-block; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:.3px; }
  .diag-badge.ok { background: var(--good-soft); color: var(--good); }
  .diag-badge.warn { background: var(--warn-soft); color: var(--warn); }
  .diag-badge.bad { background: var(--bad-soft); color: var(--bad); }
  .diag-line { font-size:12.5px; color: var(--ink-soft); padding:7px 0; border-top:1px dashed var(--border); }
  .diag-line:first-of-type { border-top:none; }

  .lab-table { width:100%; border-collapse:collapse; font-size:12.5px; }
  .lab-table th { text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color: var(--ink-faint); padding:0 8px 8px; border-bottom:1px solid var(--border); }
  .lab-table td { padding:6px 8px; border-bottom:1px solid var(--border-soft); }
  .lab-table input { width:100%; font-family:inherit; font-size:12.5px; padding:6px 8px; border:1px solid var(--border); border-radius:6px; background:var(--surface); color:var(--ink); }
  .flag { font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:20px; }
  .flag.ok { background: var(--good-soft); color: var(--good); }
  .flag.low { background: var(--warn-soft); color: var(--warn); }
  .flag.high { background: var(--bad-soft); color: var(--bad); }

  .save-row { display:flex; align-items:center; gap:12px; margin-top:22px; padding-top:16px; border-top:1px solid var(--border-soft); flex-wrap:wrap; }
  .save-status { font-size:12px; color: var(--good); }

  .queixa-card { border:1px solid var(--border); border-radius: var(--radius); margin-bottom:12px; overflow:hidden; }
  .queixa-head { padding:14px 18px; display:flex; align-items:center; gap:10px; background: var(--surface); cursor:pointer; }
  .queixa-head input[type=checkbox] { width:16px; height:16px; accent-color: var(--accent); flex-shrink:0; }
  .queixa-head .qtitle { font-size:13.5px; font-weight:700; flex:1; }
  .queixa-body { padding: 0 18px 16px; background: var(--surface); }
  .queixa-quick { background: var(--accent-soft); border-radius: var(--radius-sm); padding:12px 14px; margin-top:2px; }
  .queixa-quick .qline { font-size:12.5px; color: var(--accent-dark); padding:4px 0; }
  .aprofundar-toggle { font-size:12px; font-weight:700; color: var(--accent-dark); cursor:pointer; margin-top:10px; display:inline-block; }
  .aprofundar-panel { margin-top:14px; padding-top:14px; border-top:1px dashed var(--border); display:none; }
  .aprofundar-panel.open { display:block; }

  .subhead { font-size:12px; font-weight:700; color: var(--ink); margin: 16px 0 8px; text-transform:uppercase; letter-spacing:.3px; }
  .checkbox-inline { display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:400; color:var(--ink); }
  .checkbox-inline input { accent-color: var(--accent); }

  .source-note { font-size:11px; color: var(--ink-faint); margin-top:18px; line-height:1.5; }
  .empty-hint { font-size:12.5px; color: var(--ink-faint); padding:14px 0; }

  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(36,35,31,.35); align-items:center; justify-content:center; z-index:50; }
  .modal-overlay.show { display:flex; }
  .modal-box { background: var(--surface); border-radius: var(--radius); padding:22px 24px; width:340px; }
  .modal-box h3 { margin:0 0 14px; font-size:15px; }
  .modal-box .field { margin-bottom:12px; }
  .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:8px; }

  .disclaimer-bar { padding:12px 32px; font-size:11px; color: var(--ink-faint); border-top:1px solid var(--border-soft); text-align:center; }

  @media (max-width: 860px) {
    .field-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">Consulta Guiada</div>
    <div class="brand-sub">Nutrologia · apoio pessoal</div>
    <input class="search-input" id="searchInput" type="text" placeholder="Buscar por código/iniciais...">
    <div class="section-label">Pacientes</div>
    <ul class="patient-list" id="patientList"></ul>
    <div class="sidebar-actions">
      <button class="btn primary" id="addPatientBtn">+ Novo paciente</button>
      <label class="btn ghost file-btn">⬆ Carregar arquivo salvo<input type="file" id="loadFileInput" accept="application/json"></label>
      <button class="btn ghost" id="backupBtn">⬇ Baixar backup de todos</button>
    </div>
    <div class="footnote">Protótipo — os dados ficam só nesta aba enquanto ela está aberta. Salve cada etapa (baixa um arquivo) ou baixe o backup completo; carregue de volta pra continuar depois.</div>
  </aside>

  <main class="main" id="mainContentEl"></main>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3>Nova paciente</h3>
    <div class="field"><label>Código / iniciais (ex.: PAC003 · M.A.)</label><input type="text" id="newName"></div>
    <div class="field"><label>Data de nascimento (opcional)</label><input type="text" id="newBirth" placeholder="dd/mm/aaaa"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="cancelAdd">Cancelar</button>
      <button class="btn primary" id="confirmAdd">Criar</button>
    </div>
  </div>
</div>

<script>
(function(){
  const STEPS = [
    { id: "objetivos",   num: "1", label: "Dados objetivos" },
    { id: "bia",         num: "2", label: "Composição corporal" },
    { id: "perfil",      num: "3", label: "Queixas & hábitos" },
    { id: "conduta",     num: "4", label: "Conduta & suplementação" },
    { id: "plano",       num: "5", label: "Plano alimentar" },
    { id: "orientacoes", num: "6", label: "Orientações pra casa" },
  ];
  const LAB_DEFAULTS = [
    { nome: "Hemoglobina", unidade: "g/dL", min: "12", max: "16", valor: "", data: "" },
    { nome: "Ferritina", unidade: "ng/mL", min: "20", max: "250", valor: "", data: "" },
    { nome: "Vitamina B12", unidade: "pg/mL", min: "200", max: "900", valor: "", data: "" },
    { nome: "Vitamina D (25-OH)", unidade: "ng/mL", min: "30", max: "100", valor: "", data: "" },
    { nome: "TSH", unidade: "µUI/mL", min: "0.4", max: "4.0", valor: "", data: "" },
    { nome: "Glicemia de jejum", unidade: "mg/dL", min: "70", max: "99", valor: "", data: "" },
    { nome: "HbA1c", unidade: "%", min: "4.0", max: "5.6", valor: "", data: "" },
  ];

  let patients = [{ id: "PAC001", name: "PAC001 · J.S.", birth: "15/03/1985" }];
  let records = { PAC001: {} };
  let activeId = null;
  let activeStep = STEPS[0].id;

  function uid(){ return "PAC" + String(Math.floor(1000 + (patients.length * 137 + 53) % 8999)).slice(0,3) + Date.now().toString().slice(-3); }
  function escapeHtml(str){
    return String(str == null ? "" : str).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }
  function num(v){ const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? null : n; }
  function opt(val, cur){ return `<option value="${val}" ${val===cur?"selected":""}>${val}</option>`; }
  function downloadJSON(filename, dataObj){
    const blob = new Blob([JSON.stringify(dataObj, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  const searchInput = document.getElementById("searchInput");
  const patientListEl = document.getElementById("patientList");
  const mainContentEl = document.getElementById("mainContentEl");
  const modalOverlay = document.getElementById("modalOverlay");

  function renderPatientList(){
    const q = (searchInput.value || "").toLowerCase();
    patientListEl.innerHTML = "";
    patients.filter(p => p.name.toLowerCase().includes(q)).forEach(p => {
      const li = document.createElement("li");
      li.className = "patient-row" + (p.id === activeId ? " active" : "");
      li.innerHTML = `<div class="pname">${escapeHtml(p.name)}</div><div class="pmeta">${p.birth ? "Nasc. " + escapeHtml(p.birth) : "Sem data"}</div>`;
      li.addEventListener("click", () => selectPatient(p.id));
      patientListEl.appendChild(li);
    });
  }
  function selectPatient(id){ activeId = id; activeStep = STEPS[0].id; renderPatientList(); renderMain(); }

  function stepDone(record, stepId){
    const r = record || {};
    if(stepId === "objetivos") return !!(r.objetivos && (r.objetivos.peso || r.objetivos.altura));
    if(stepId === "bia") return !!(r.bia && (r.bia.mm_atual || r.bia.peso_atual));
    if(stepId === "perfil") return !!(r.perfil && r.perfil.queixas && Object.values(r.perfil.queixas).some(Boolean));
    if(stepId === "conduta") return !!(r.esportiva || r.perimenopausa || r.suplementacao || r.fadiga);
    if(stepId === "plano") return !!(r.calculadora && r.calculadora.peso);
    if(stepId === "orientacoes") return !!(r.orientacoes && r.orientacoes.texto);
    return false;
  }

  function renderMain(){
    if(!activeId){
      mainContentEl.innerHTML = `<div style="display:flex; align-items:center; justify-content:center; height:100%; color:var(--ink-faint); font-size:13px; padding:60px;">Selecione uma paciente na lista, ou crie uma nova ficha para começar.</div>`;
      return;
    }
    const patient = patients.find(p => p.id === activeId);
    if(!patient){ activeId = null; return renderMain(); }
    const record = records[activeId] || (records[activeId] = {});
    mainContentEl.innerHTML = `
      <div class="patient-header">
        <div>
          <h1>${escapeHtml(patient.name)}</h1>
          <div class="meta">${patient.birth ? "Nascimento: " + escapeHtml(patient.birth) : "Sem data de nascimento cadastrada"}</div>
        </div>
        <div class="header-actions">
          <button class="btn ghost small" id="printBtn">Imprimir</button>
          <button class="btn danger small" id="deleteBtn">Remover</button>
        </div>
      </div>
      <nav class="step-nav" id="stepNavEl"></nav>
      <div class="step-panel" id="stepPanelEl"></div>
      <div class="disclaimer-bar">Ferramenta de apoio pessoal — não substitui o prontuário oficial. Não inclua nome completo, CPF ou nº de prontuário.</div>
    `;
    const stepNavEl = document.getElementById("stepNavEl");
    STEPS.forEach(s => {
      const el = document.createElement("div");
      el.className = "step-pill" + (s.id === activeStep ? " active" : "") + (stepDone(record, s.id) ? " done" : "");
      el.innerHTML = `<span class="n">${stepDone(record, s.id) && s.id !== activeStep ? "✓" : s.num}</span>${s.label}`;
      el.addEventListener("click", () => { activeStep = s.id; renderMain(); });
      stepNavEl.appendChild(el);
    });
    document.getElementById("printBtn").addEventListener("click", () => window.print());
    document.getElementById("deleteBtn").addEventListener("click", () => {
      if(!confirm("Remover esta paciente desta tela? (a planilha definitiva não é afetada)")) return;
      patients = patients.filter(p => p.id !== activeId);
      delete records[activeId];
      activeId = null;
      renderPatientList(); renderMain();
    });
    const panelEl = document.getElementById("stepPanelEl");
    if(activeStep === "objetivos") renderObjetivosStep(panelEl, record);
    else if(activeStep === "bia") renderBiaStep(panelEl, record);
    else if(activeStep === "perfil") renderPerfilStep(panelEl, record);
    else if(activeStep === "conduta") renderCondutaStep(panelEl, record);
    else if(activeStep === "plano") renderPlanoStep(panelEl, record);
    else if(activeStep === "orientacoes") renderOrientacoesStep(panelEl, record);
  }

  // ---------------------------------------------------------------------
  // ETAPA 1 — Dados objetivos
  // ---------------------------------------------------------------------
  function renderObjetivosStep(panelEl, record){
    const d = record.objetivos || {};
    let rows = d.labs ? JSON.parse(JSON.stringify(d.labs)) : JSON.parse(JSON.stringify(LAB_DEFAULTS));
    function labFlag(row){
      const v = num(row.valor), min = num(row.min), max = num(row.max);
      if(v === null || min === null || max === null) return "";
      if(v < min) return `<span class="flag low">baixo</span>`;
      if(v > max) return `<span class="flag high">alto</span>`;
      return `<span class="flag ok">na faixa</span>`;
    }
    function labRow(row, idx){
      return `<tr data-idx="${idx}">
        <td><input type="text" class="lab-nome" value="${escapeHtml(row.nome||"")}" /></td>
        <td><input type="text" class="lab-valor" value="${escapeHtml(row.valor||"")}" style="width:65px;" /></td>
        <td><input type="text" class="lab-unidade" value="${escapeHtml(row.unidade||"")}" style="width:65px;" /></td>
        <td><input type="text" class="lab-min" value="${escapeHtml(row.min||"")}" style="width:50px;" /></td>
        <td><input type="text" class="lab-max" value="${escapeHtml(row.max||"")}" style="width:50px;" /></td>
        <td class="lab-flag-cell">${labFlag(row)}</td>
        <td><button class="btn ghost small lab-remove" type="button">×</button></td>
      </tr>`;
    }
    function fullHtml(){
      return `
        <div class="step-title">Dados objetivos</div>
        <div class="step-sub">Antropometria, pressão arterial e exames-chave. Preencha ao vivo durante a consulta — esses valores são reaproveitados automaticamente no plano alimentar e na composição corporal.</div>
        <div class="card">
          <div class="card-head">Antropometria</div>
          <div class="field-grid">
            <div class="field"><label>Peso (kg)</label><input type="text" id="ob_peso" value="${escapeHtml(d.peso||"")}" /></div>
            <div class="field"><label>Altura (cm)</label><input type="text" id="ob_altura" value="${escapeHtml(d.altura||"")}" /></div>
            <div class="field"><label>Idade (anos)</label><input type="text" id="ob_idade" value="${escapeHtml(d.idade||"")}" /></div>
            <div class="field"><label>Sexo biológico</label>
              <select id="ob_sexo">
                <option value="">Selecione...</option>
                <option value="F" ${d.sexo==="F"?"selected":""}>Feminino</option>
                <option value="M" ${d.sexo==="M"?"selected":""}>Masculino</option>
              </select>
            </div>
            <div class="field"><label>PA sistólica (mmHg)</label><input type="text" id="ob_pa_sist" value="${escapeHtml(d.pa_sist||"")}" /></div>
            <div class="field"><label>PA diastólica (mmHg)</label><input type="text" id="ob_pa_diast" value="${escapeHtml(d.pa_diast||"")}" /></div>
          </div>
        </div>
        <div class="card">
          <div class="card-head">Exames laboratoriais</div>
          <div style="overflow-x:auto;">
          <table class="lab-table">
            <thead><tr><th>Exame</th><th>Valor</th><th>Unid.</th><th>Mín.</th><th>Máx.</th><th>Status</th><th></th></tr></thead>
            <tbody id="labBody">${rows.map(labRow).join("")}</tbody>
          </table>
          </div>
          <button class="btn ghost small" id="addLabRow" type="button" style="margin-top:10px;">+ Adicionar exame</button>
        </div>
        <div class="save-row">
          <button class="btn primary" id="saveStepBtn">Salvar etapa (baixa arquivo)</button>
          <span class="save-status" id="saveStatus"></span>
        </div>`;
    }
    function readData(){
      return {
        peso: document.getElementById("ob_peso").value,
        altura: document.getElementById("ob_altura").value,
        idade: document.getElementById("ob_idade").value,
        sexo: document.getElementById("ob_sexo").value,
        pa_sist: document.getElementById("ob_pa_sist").value,
        pa_diast: document.getElementById("ob_pa_diast").value,
        labs: rows,
      };
    }
    function sync(){ record.objetivos = readData(); }
    function bind(){
      ["ob_peso","ob_altura","ob_idade","ob_sexo","ob_pa_sist","ob_pa_diast"].forEach(id => {
        const el = document.getElementById(id);
        el.addEventListener("input", sync);
        el.addEventListener("change", sync);
      });

  function computeBiaDiagnostico(x, record){
    const ob = (record && record.objetivos) || {};
    const perfil = (record && record.perfil) || {};
    const glp1 = perfil.medicamentos && perfil.medicamentos.glp1 && perfil.medicamentos.glp1 !== "Não usa" ? perfil.medicamentos.glp1 : null;
    const hasInput = x.aparelho !== "Não informado" || x.prep_exercicio || x.prep_hidratacao || x.prep_jejum || x.prep_metal ||
      x.peso_atual || x.peso_anterior || x.mm_atual || x.mm_anterior || x.gord_atual || x.gord_anterior || x.visceral ||
      x.handgrip || x.cadeira;
    if(!hasInput){
      return { badgeClass:"warn", badgeLabel:"sem dados", headline:"Preencha as medidas acima", linhas:["Assim que houver ao menos um valor preenchido, o diagnóstico aparece aqui automaticamente."] };
    }
    const linhas = [];
    let pior = "ok"; // ok < warn < bad

    if(x.aparelho !== "Octopolar multifrequencial (recomendado)"){
      linhas.push("Aparelho não confirmado como octopolar multifrequencial: ABESO (2016) e ABRAN/Sociedade Brasileira de Medicina do Esporte recomendam BIA octopolar (8 eletrodos) e multifrequencial para reprodutibilidade e acurácia clínica.");
      pior = "warn";
    }
    const prepFaltando = [];
    if(!x.prep_exercicio) prepFaltando.push("abstinência de exercício 24h");
    if(!x.prep_hidratacao) prepFaltando.push("sem álcool/diuréticos 12h");
    if(!x.prep_jejum) prepFaltando.push("jejum 2–4h");
    if(!x.prep_metal) prepFaltando.push("sem metais");
    if(prepFaltando.length){
      linhas.push(`Preparo incompleto (faltando: ${prepFaltando.join(", ")}): resultado pode estar enviesado — ex.: exercício intenso recente subestima a massa muscular.`);
      pior = "warn";
    }

    const pesoA = num(x.peso_atual), pesoP = num(x.peso_anterior), mmA = num(x.mm_atual), mmP = num(x.mm_anterior),
          gordA = num(x.gord_atual), gordP = num(x.gord_anterior);
    if(pesoA !== null && pesoP !== null && mmA !== null && mmP !== null){
      const dPeso = pesoA - pesoP, dMM = mmA - mmP, dGord = (gordA !== null && gordP !== null) ? gordA - gordP : null;
      if(dPeso > 0 && dMM > 0 && (dGord === null || dGord <= 0)){
        linhas.push(`Ganho de peso "paradoxal": peso +${dPeso.toFixed(1)} kg, mas massa muscular +${dMM.toFixed(1)} kg${dGord !== null ? ` e gordura ${dGord.toFixed(1)} kg` : ""} — composição melhorou. Mensagem à paciente: "seu peso aumentou, mas a composição mudou a seu favor".`);
      } else {
        linhas.push(`Variação desde a avaliação anterior: peso ${dPeso>=0?"+":""}${dPeso.toFixed(1)} kg, massa muscular ${dMM>=0?"+":""}${dMM.toFixed(1)} kg${dGord !== null ? `, gordura ${dGord>=0?"+":""}${dGord.toFixed(1)} kg` : ""}.`);
      }
    }

    let sarcopenia = false;
    const handgrip = num(x.handgrip), cadeira = num(x.cadeira), sexo = ob.sexo;
    if(handgrip !== null && sexo){
      const corte = sexo === "M" ? 27 : 16;
      if(handgrip < corte){ sarcopenia = true; linhas.push(`Handgrip ${handgrip} kg abaixo do ponto de corte (${sexo==="M"?"<27 kg homens":"<16 kg mulheres"}) — risco de sarcopenia.`); }
    }
    if(cadeira !== null && cadeira <= 5){ sarcopenia = true; linhas.push("Teste da cadeira com ≤5 repetições em 15s — risco de sarcopenia."); }
    if(sarcopenia){ pior = "bad"; linhas.push("Reforçar treino de força progressivo e proteína 1,6–2,2 g/kg/dia."); }

    if(glp1){
      linhas.push(`Em uso de ${glp1}: risco de perda de massa muscular se proteína/estímulo de força não forem mantidos — monitorar BIA mensalmente, considerar elevar proteína até 2,2 g/kg/dia.`);
      if(pior === "ok") pior = "warn";
    }

    const visceral = num(x.visceral);
    if(visceral !== null){
      if(visceral < 100){
        linhas.push(`Gordura visceral ${visceral} cm² (<100): risco cardiometabólico reduzido.`);
      } else {
        linhas.push(`Gordura visceral ${visceral} cm² (≥100): risco aumentado — reforçar déficit calórico moderado (-10% a -20%) e treino de força + cardio leve.`);
        pior = "bad";
      }
    }

    let headline, badgeLabel;
    if(pior === "bad"){ headline = "Achados relevantes na composição corporal"; badgeLabel = "atenção"; }
    else if(pior === "warn"){ headline = "Composição corporal com pontos de atenção"; badgeLabel = "revisar"; }
    else { headline = "Composição corporal dentro do esperado"; badgeLabel = "ok"; }
    if(!linhas.length) linhas.push("Nenhum achado de risco identificado com os dados preenchidos até agora.");
    return { badgeClass: pior, badgeLabel, headline, linhas };
  }

      <div class="source-note">Fonte: Nutroweek 23, Aula 5 (Dr. Guilherme Giorelli, HIA Einstein).</div>
    `;
    const ids = ["sp_objetivo","sp_perfil","sp_esforco","sp_restricoes","sp_renal","sp_has","sp_dm","sp_prova_longa",
      "sp_uso_cafeina","sp_uso_creatina","sp_uso_betaalanina","sp_uso_bicarbonato","sp_uso_nitrato","sp_uso_whey",
      "sp_uso_caseina","sp_uso_omega3","sp_uso_vitd","sp_uso_calcio","sp_uso_ferro"];
    function isChecked(id){ const el = document.getElementById(id); return el ? el.checked : false; }
    function val(id){ const el = document.getElementById(id); return el ? el.value : ""; }
    function readData(){
      return {
        objetivo: val("sp_objetivo"), perfil: val("sp_perfil"), esforco: val("sp_esforco"), restricoes: val("sp_restricoes"),
        renal: isChecked("sp_renal"), has: isChecked("sp_has"), dm: isChecked("sp_dm"), prova_longa: isChecked("sp_prova_longa"),
        uso_cafeina: isChecked("sp_uso_cafeina"), uso_creatina: isChecked("sp_uso_creatina"), uso_betaalanina: isChecked("sp_uso_betaalanina"),

        uso_calcio: isChecked("sp_uso_calcio"), uso_ferro: isChecked("sp_uso_ferro"),
      };
    }
    function computeSuggestions(x){
      const s = [];
      const choMap = {
        "Endurance (>60 min contínuo)": "8–12 g/kg/dia de carboidrato — necessário para repor glicogênio e sustentar sessões longas.",
        "Alta intensidade (<1h)": "3–5 g/kg/dia de carboidrato — suficiente para manter glicemia e evitar fadiga em esforços curtos e intensos.",
        "Força/potência": "3–5 g/kg/dia de carboidrato — a proteína é priorizada, mas o carboidrato ainda é necessário para a recuperação.",
      };
      s.push(choMap[x.esforco] || choMap["Alta intensidade (<1h)"]);
      if(x.perfil === "Atleta profissional" || x.objetivo === "Performance/competição"){
        s.push("Proteína total 1,2–2,0 g/kg/dia. Timing sugerido: café da manhã 0,3 g/kg (whey ou proteína vegetal de rápida absorção) · almoço 0,3 g/kg (fonte completa) · lanche da tarde 0,2 g/kg (whey ou caseína) · jantar 0,3 g/kg (fonte completa + caseína) · pós-treino 0,2–0,3 g/kg de whey isolado, ~30 min após o treino.");
      } else {
        s.push("Proteína total 1,2–2,0 g/kg/dia, distribuída ao longo do dia a cada 3–4h.");
      }
      const ergo = [];
      if(x.esforco === "Força/potência" || x.objetivo === "Hipertrofia" || x.perfil === "Vegetariano/vegano"){
        ergo.push("Creatina 3–5 g/dia contínuo (carga opcional 20 g/dia por 5–7 dias) — repõe fosfocreatina, aumenta força explosiva.");
      }
      if(x.esforco === "Alta intensidade (<1h)"){
        ergo.push("Beta-alanina 2–6 g/dia dividida (carga 4–6 g/dia por 4–6 semanas) — eleva carnosina intramuscular.");
        ergo.push("Bicarbonato de sódio 300 mg/kg 2–3h antes — reduz acidez extracelular em esforços intensos de curta duração.");
      }
      if(x.esforco === "Endurance (>60 min contínuo)"){
        ergo.push("Nitrato/beterraba ≥300 mg (≈150 g de beterraba) 2–3h antes — melhora a eficiência muscular.");
      }
      if(x.objetivo === "Performance/competição" || x.objetivo === "Emagrecimento"){
        ergo.push("Cafeína 3–6 mg/kg/dia, 60 min antes — reduz a percepção de esforço.");
      }
      if(ergo.length){ s.push(`Ergogênicos indicados (evidência nível A, IOC/ACSM): ${ergo.join(" ")}`); }
      else { s.push("Nenhum dos 5 ergogênicos de evidência nível A se destaca especificamente para este objetivo/esforço."); }
      if(x.perfil === "Vegetariano/vegano"){ s.push("Perfil vegetariano/vegano: reforçar creatina 3–5 g/dia e beta-alanina >2 g/dia (carnosina endógena mais baixa)."); }
      if(x.renal){ s.push("Insuficiência renal: creatina e bicarbonato exigem cautela — avaliar função renal antes."); }
      if(x.has){ s.push("Hipertensão: cautela com cafeína em doses altas e sódio do bicarbonato."); }
      if(x.dm){ s.push("Diabetes: atenção ao carboidrato dos suplementos (maltodextrina/palatinose), doses fracionadas."); }
      if(!x.uso_vitd || !x.uso_calcio || !x.uso_ferro || !x.uso_omega3){
        s.push("Suplementos médicos ainda não em uso (indicar conforme exame/deficiência): cálcio, ferro, vitamina D, ômega-3 1–2 g/dia EPA+DHA.");
      }
      if(x.prova_longa){
        s.push('"Training the gut": semana 1–2: 30 g/h · semana 3–4: 45 g/h · semana 5–6: 60 g/h (maltodextrina+frutose) · semana 7+: 90–100 g/h.');
      }
      s.push("Reavaliar a cada 4–6 semanas (3 E's — Escutar, Executar, Estudar).");
      return s;
    }
    function refresh(){
      const s = computeSuggestions(readData());
      document.getElementById("spResultBox").innerHTML = `<div class="diag-box">${s.map(t=>`<div class="diag-line">${t}</div>`).join("")}</div>`;
    }
    function sync(){ record.suplementacao = readData(); }
    ids.forEach(id => { const el = document.getElementById(id); el.addEventListener("input", () => { sync(); refresh(); }); el.addEventListener("change", () => { sync(); refresh(); }); });
    sync(); refresh();
    document.getElementById("spSaveBtn").addEventListener("click", () => {
      sync();
      downloadJSON(`${activeId}_suplementacao.json`, { paciente: activeId, etapa: "suplementacao", dados: record.suplementacao });

    });

  function computeQuickEmagrecimento(record){
    const s = [];
    const perfil = record.perfil || {};
    const h = perfil.habitos || {};
    const m = perfil.medicamentos || {};
    const bia = record.bia || {};
    const diag = computeBiaDiagnostico(bia, record);
    if(m.glp1 && m.glp1 !== "Não usa"){
      s.push(`Em uso de ${m.glp1}: priorizar proteína 1,2–2,2 g/kg/dia e treino de força para preservar massa magra durante a perda de peso.`);
    }
    const sarcopenia = diag.linhas.some(l => l.includes("sarcopenia"));
    const visceralAlto = diag.linhas.some(l => l.includes("risco aumentado"));
    if(sarcopenia){ s.push("Sinal de sarcopenia identificado na composição corporal — a meta de emagrecimento deve vir com treino de força e proteína ≥1,6 g/kg, não só déficit calórico."); }
    if(visceralAlto){ s.push("Gordura visceral elevada — déficit calórico moderado (-10% a -20% da TMB) é preferível a um déficit agressivo."); }
    if(h.plato){ s.push("Platô relatado: variar carga, volume ou frequência do treino antes de aprofundar ainda mais o déficit calórico."); }
    if(!s.length){ s.push("Déficit calórico moderado (ver Plano Alimentar) associado a treino de resistência preserva massa magra melhor que dieta isolada."); }
    return s;
  }
  function computeQuickFadiga(record){
    const s = [];
    const perfil = record.perfil || {};
    const h = perfil.habitos || {};
    const m = perfil.medicamentos || {};
    const labs = (record.objetivos && record.objetivos.labs) || [];
    const alterados = labs.filter(r => { const v=num(r.valor), mi=num(r.min), ma=num(r.max); return v!==null && mi!==null && ma!==null && (v<mi || v>ma); });
    if(alterados.length){
      s.push(`Exames fora da faixa na Etapa 1: ${alterados.map(r => r.nome).join(", ")} — investigar como possível causa da fadiga.`);
    }
    if(h.sono === "<6h"){ s.push("Sono <6h/noite relatado: priorizar 7–9h antes de investigar outras causas — sono insuficiente já explica boa parte de fadiga/baixa energia."); }
    if(m.glp1 && m.glp1 !== "Não usa"){ s.push(`Em uso de ${m.glp1}: fadiga pode ser efeito colateral — considerar fracionar refeições e checar eletrólitos.`); }
    s.push("Lembrar (Aula 6): HbA1c normal não exclui variações glicêmicas agudas — se a queixa persistir sem causa clara, aprofundar com a triagem completa abaixo.");
    return s;
  }
  function computeQuickPerformance(record){
    const s = [];
    const h = (record.perfil && record.perfil.habitos) || {};
    const ergoMap = {
      "Endurance (>60 min contínuo)": "Priorizar carboidrato (8–12 g/kg/dia) e considerar nitrato/beterraba ≥300 mg 2–3h antes — foco em economia de esforço prolongado.",
      "Alta intensidade (<1h)": "Beta-alanina e bicarbonato de sódio são os ergogênicos com melhor racional para esforços intensos repetidos <1h.",
      "Força/potência": "Creatina 3–5 g/dia contínuo é o ergogênico com melhor racional para força/potência.",
    };
    s.push(ergoMap[h.esforco_tipo] || "Defina o tipo de esforço predominante nos hábitos (Etapa 3) para uma sugestão de suplementação mais específica.");
    s.push("Proteína total 1,2–2,0 g/kg/dia, distribuída a cada 3–4h, é a base independente da modalidade.");
    return s;
  }
  function computeQuickPerimenopausa(record){
    const s = [];
    const idade = num(record.objetivos && record.objetivos.idade);
    const h = (record.perfil && record.perfil.habitos) || {};
    if(idade !== null){
      if(idade < 50) s.push(`${idade} anos: fase típica de início da perimenopausa — queda gradual de estrogênio/progesterona, testosterona ovariana também começa a cair.`);
      else if(idade < 60) s.push(`${idade} anos: fase de redução mais acentuada de estrogênio — treino e nutrição precisam compensar ativamente a perda hormonal.`);
      else s.push(`${idade} anos: predomínio da produção adrenal de andrógenos — reforçar treino de força e proteína.`);
    }
    if(h.treino === "Não pratica"){ s.push("Ainda não treina: iniciar treino de força progressivo é a intervenção mais eficaz nessa fase."); }
    else { s.push("Priorizar treino de força ≥85% 1RM e horário entre 14h–20h (janela de cortisol mais baixo)."); }
    return s;
  }

  function downloadText(filename, text){
    const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function computeCalculadora(d){
    const peso = num(d.peso), altura = num(d.altura), idade = num(d.idade);
    const sexo = d.sexo, formula = d.formula || "mifflin", fatorAt = num(d.fator) || 1.375,
          ajusteKcal = num(d.ajuste) || 0, protGkg = num(d.prot_gkg), gordPct = (num(d.gord_pct) || 25) / 100;
    if(!peso || !altura || !idade || !sexo) return null;
    let tmb;
    if(formula === "harris"){
      tmb = sexo === "M" ? 13.397*peso + 4.799*altura - 5.677*idade + 88.362 : 9.247*peso + 3.098*altura - 4.330*idade + 447.593;
    } else {
      tmb = sexo === "M" ? 10*peso + 6.25*altura - 5*idade + 5 : 10*peso + 6.25*altura - 5*idade - 161;
    }
    const get = tmb * fatorAt;
    const meta = get + ajusteKcal;
    const proteinaG = protGkg ? protGkg * peso : null;
    const proteinaKcal = proteinaG ? proteinaG * 4 : null;
    const gorduraKcal = meta * gordPct;
    const gorduraG = gorduraKcal / 9;
    const carboKcal = proteinaKcal ? meta - proteinaKcal - gorduraKcal : null;
    const carboG = carboKcal !== null ? carboKcal / 4 : null;
    return { tmb, get, meta, proteinaG, proteinaKcal, gorduraKcal, gorduraG, carboKcal, carboG };
  }

    "5": [ {nome:"Café da manhã", pct:0.20, lanche:true}, {nome:"Lanche da manhã", pct:0.10, lanche:true}, {nome:"Almoço", pct:0.30, lanche:false}, {nome:"Lanche da tarde", pct:0.15, lanche:true}, {nome:"Jantar", pct:0.25, lanche:false} ],

  function gerarOrientacoesDraft(record){
    const perfil = record.perfil || {};
    const q = perfil.queixas || {};
    const ativos = QUEIXAS_DEF.filter(qd => q[qd.key]);
    const quickFns = { emagrecimento: computeQuickEmagrecimento, fadiga: computeQuickFadiga, performance: computeQuickPerformance, perimenopausa: computeQuickPerimenopausa };
    let txt = `Olá! Aqui está um resumo do que conversamos na consulta de hoje e os próximos passos até o retorno.\n`;
    if(!ativos.length){
      txt += `\n(Nenhuma queixa foi marcada na Etapa 3 ainda — volte lá e marque, ou escreva livremente aqui.)\n`;
    }
    ativos.forEach(qd => {
      txt += `\n${qd.label.toUpperCase()}\n`;
      quickFns[qd.key](record).forEach(b => { txt += `- ${b.replace(/<[^>]+>/g, "")}\n`; });
    });
    if((perfil.queixa_livre||"").trim()){
      txt += `\nOUTRAS QUEIXAS RELATADAS\n- ${perfil.queixa_livre}\n`;
    }
    const calc = record.calculadora;
    if(calc && calc.resultado){
      const r = calc.resultado;
      txt += `\nPLANO ALIMENTAR (resumo — o cardápio completo está em documento separado)\nMeta calórica: ${r.meta.toFixed(0)} kcal/dia`;
      if(r.proteinaG) txt += ` · Proteína: ${r.proteinaG.toFixed(0)} g/dia`;
      txt += `\n`;
    }
    const supUso = [];
    if(record.suplementacao) supUso.push("suplementação (ver roteiro detalhado)");
    if(record.esportiva) supUso.push("nutrição esportiva (ver roteiro detalhado)");
    if(record.perimenopausa) supUso.push("perimenopausa (ver roteiro detalhado)");
    if(supUso.length){ txt += `\nTambém revisamos: ${supUso.join(", ")}.\n`; }
    txt += `\nQualquer dúvida até o retorno, me chame. Um abraço!`;
    return txt;
  }

          else if(parsed.etapa === "fadiga") records[parsed.paciente].fadiga = parsed.dados;
          else if(parsed.etapa === "calculadora") records[parsed.paciente].calculadora = parsed.dados;
          else if(parsed.etapa === "orientacoes") records[parsed.paciente].orientacoes = parsed.dados;
        }
        renderPatientList(); renderMain();
        alert("Arquivo carregado com sucesso.");
      } catch(err){
        alert("Não consegui ler esse arquivo — confirme se é um .json salvo por esta ferramenta.");
      }
      e.target.value = "";
    };
    reader.readAsText(file);
  });
  searchInput.addEventListener("input", renderPatientList);

  renderPatientList();
  renderMain();
})();
</script>
